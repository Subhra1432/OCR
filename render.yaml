services:
  - type: web
    name: ai-ocr-mining
    env: python
    buildCommand: "pip install -r requirements-render.txt"
    startCommand: "gunicorn -w 1 --timeout 120 -b 0.0.0.0:$PORT frontend_app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: HF_BACKEND_URL
        value: "https://subhra1432-ai-ocr-mining.hf.space"

